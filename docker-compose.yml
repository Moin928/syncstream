services:

  mysql:
    image: mysql:8.0
    container_name: syncstream-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: syncstream

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    volumes:
      - syncstream-mysql-data:/var/lib/mysql

    networks:
      - syncstream-db-net


  backend:
    build:
      context: ./backend

    container_name: syncstream-backend
    restart: unless-stopped

    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/syncstream

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy
      runner:
        condition: service_started

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - syncstream-db-net
      - syncstream-runner-net
      - syncstream-app-net


  runner:
    build:
      context: ./backend/runner

    container_name: syncstream-runner
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
          pids: 100

    command:
      - sleep
      - infinity

    volumes:
      - syncstream-runner-workspace:/workspace

    networks:
      - syncstream-runner-net


  frontend:
    build:
      context: ./frontend

    container_name: syncstream-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - syncstream-app-net


networks:
  syncstream-db-net:
    driver: bridge

  syncstream-runner-net:
    driver: bridge
    internal: true

  syncstream-app-net:
    driver: bridge


volumes:
  syncstream-mysql-data:
  syncstream-runner-workspace: