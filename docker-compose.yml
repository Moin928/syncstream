services:

  mysql:
    image: mysql:8.0
    container_name: syncstream-mysql
    restart: unless-stopped

    environment:
      # uses the database password stored in the environment file
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: syncstream

    ports:
      - "3307:3306"

    volumes:
      # keeps mysql data available even when the container is recreated
      - syncstream-mysql-data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: syncstream-backend
    restart: unless-stopped

    environment:
      # passes the database password to the spring boot container
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/syncstream

    ports:
      - "8080:8080"

    # starts mysql before the backend container
    depends_on:
      - mysql

volumes:

  # stores the mysql database data outside the container
  syncstream-mysql-data: